name: Check Meta for announcements

# Runs on GitHub's servers, so it can read Meta's feeds directly.
# A browser cannot do this, which is why the job lives here.
#
# When something new appears it does two things:
#   1. saves it into the course, so the New Update badge counts it
#   2. opens an issue that mentions you, which sends an email and a
#      phone notification through the GitHub app

on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC
  workflow_dispatch:          # and whenever you press Run workflow

permissions:
  contents: write             # to save the announcements into the course
  issues: write               # to send you the notification

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read the official feeds
        run: node scripts/fetch-updates.mjs

      - name: Save anything new into the course
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/feed.js; then
            echo "Nothing has changed since the last check."
          else
            git add data/feed.js
            git commit -m "Meta announcements, $(date -u +%d\ %B\ %Y)"
            git push
            echo "Saved."
          fi

      - name: Send the notification
        if: hashFiles('new-items.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(grep -c '^### ' new-items.md || echo "several")
          gh issue create \
            --title "Meta announced something new ($(date -u +%d\ %B))" \
            --body-file new-items.md \
            --label "meta update" 2>/dev/null \
          || gh issue create \
            --title "Meta announced something new ($(date -u +%d\ %B))" \
            --body-file new-items.md
          echo "Notification sent for $COUNT announcements."
